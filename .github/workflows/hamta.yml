# Hämtar guilden från Blizzard, bygger sidan och publicerar den på GitHub Pages. Ersätter Windows-schemat.
# Datan (snapshots, händelser, läge) committas tillbaka så att historiken växer i repot.
# Bilderna (porträtt, ikoner, helkroppsbilder) sparas i Actions-cachen.
name: Hämta och bygg

on:
  # cron-job.org startar den var 30:e minut via GitHubs API: GitHubs eget schema är för opålitligt
  workflow_dispatch:          # också "Run workflow"-knappen

concurrency:
  group: hamta
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # för att rensa gamla bildcacher

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # utan bildcache och när Blizzard är långsamt kan 30 min vara för lite
    env:
      # HEMMET i WoW Forever sedan 2026-11-05. Forever har ingen realm i adresserna, så REALM används inte.
      # Variables (Settings → Secrets and variables → Variables) går före, t.ex. för att köra testguilden igen:
      # REALM=stitches, GUILD=Frienship, OUT=data/hc och NS=classic1x.
      REALM: ${{ vars.REALM || 'stitches' }}
      GUILD: ${{ vars.GUILD || 'HEMMET' }}
      OUT: ${{ vars.OUT || 'data/hemmet' }}
      NS: ${{ vars.NS || 'forever' }}
      PYTHONUNBUFFERED: "1"   # loggen syns medan den körs, inte först i slutet
    steps:
      # Senaste main, inte committen från när körningen startades: väntar den i kön har förra körningen
      # hunnit committa, och då krockar datan när den ska sparas
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow numpy

      - name: Bilder från förra körningen
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.OUT }}/avatars
            ${{ env.OUT }}/icons
            ${{ env.OUT }}/renders
          key: bilder-${{ github.run_id }}
          restore-keys: bilder-

      - name: Hämta
        env:
          BNET_ID: ${{ secrets.BNET_ID }}
          BNET_SECRET: ${{ secrets.BNET_SECRET }}
        run: python scripts/fetch_hemmet.py --realm "$REALM" --guild "$GUILD" --out "$OUT" ${NS:+--ns "$NS"}

      # Sparas direkt, så att bilderna inte laddas ner igen om ett senare steg fallerar
      - name: Spara bilderna
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.OUT }}/avatars
            ${{ env.OUT }}/icons
            ${{ env.OUT }}/renders
          key: bilder-${{ github.run_id }}

      # Varje körning sparar en ny kopia (~25 MB). Behåll de tre senaste, så att cachen inte växer mot GitHubs gräns på 10 GB
      - name: Rensa gamla bildcacher
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key bilder- --sort created_at --order desc --limit 1000 --json id -q '.[3:][].id' | xargs -r -n1 gh cache delete

      - name: Bygg
        run: |
          python scripts/build_hemmet.py --src "$OUT"
          python scripts/build_dist.py

      # Underlaget till veckobrevet. Får inte stoppa sidan om den fallerar
      - name: Veckan
        continue-on-error: true
        run: python scripts/veckan.py --src "$OUT"

      - name: Spara datan i repot
        run: |
          git config user.name "hemmet-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUT/members.json" "$OUT/items.json" "$OUT/state.json" "$OUT/events.jsonl" "$OUT/snapshots"
          if git diff --cached --quiet; then echo "Inget nytt"; exit 0; fi
          git commit -m "Hämtning $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash   # bygget ändrar filer i hemmet/ som inte ska med
          git push

      - name: Sidan till GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
          retention-days: 3

  # Publicerar på resan.hemmet.wtf (egen domän: Settings → Pages → Custom domain)
  publicera:
    needs: hamta
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
